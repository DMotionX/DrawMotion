<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs>
    <style>
        .stroke-main { fill: none; stroke: #2C3E50; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .stroke-accent { fill: none; stroke: #3498DB; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .stroke-highlight { fill: none; stroke: #E74C3C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .fill-main { fill: #2C3E50; stroke: none; }
        .fill-accent { fill: #3498DB; stroke: none; }
        .fill-bg { fill: #ECF0F1; stroke: #2C3E50; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .dashed { fill: none; stroke: #7F8C8D; stroke-width: 2; stroke-dasharray: 5,5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</defs>
<line x1="20" y1="50" x2="80" y2="50" class="stroke-main" /><line x1="30" y1="50" x2="30" y2="20" class="stroke-main" /><line x1="50" y1="50" x2="50" y2="80" class="stroke-main" /><line x1="70" y1="50" x2="70" y2="20" class="stroke-main" /><rect x="20" y="10" width="20" height="10" rx="2" class="fill-bg" /><rect x="40" y="80" width="20" height="10" rx="2" class="fill-bg" /><rect x="60" y="10" width="20" height="10" rx="2" class="fill-bg" />
