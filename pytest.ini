[pytest]
pythonpath = .
# Configure pytest to use PySide6 for pytest-qt
qt_api=pyside6

# Test discovery
testpaths = tests
norecursedirs = fixtures manual .git venv
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Useful flags: 
# -v for verbose output
# --cov for code coverage (uncomment when needed)
# addopts = -v --cov=. --cov-report=term-missing
