name: Linux Real-Environment Test Suite (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test_linux:
    name: Run Pytest Suite on Real Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies for Qt6 & Multimedia
        run: |
          sudo apt-get update
          ALSA_PKG="libasound2t64"
          if ! apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG="libasound2"
          fi
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            $ALSA_PKG \
            libpulse0 \
            ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt

      - name: Run Pytest Matrix in Offscreen Mode
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/
