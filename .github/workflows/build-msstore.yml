name: Build Microsoft Store Package (MSIX)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build_msix:
    name: Build & Package MSIX for Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka
      - name: Clean Local Caches
        run: |
          if (Test-Path "assets/uploads") { Remove-Item -Recurse -Force "assets/uploads" }
          if (Test-Path "assets/library") { Remove-Item -Recurse -Force "assets/library" }
          if (Test-Path "*.sqlite") { Remove-Item -Force "*.sqlite" }

      - name: Provision FFmpeg Binary for Packaging
        run: |
          if (-not (Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" -Force }
          if (-not (Test-Path "bin\ffmpeg.exe")) {
            $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($ffmpegCmd) {
              Copy-Item -Force $ffmpegCmd.Source "bin\ffmpeg.exe"
              Write-Host "FFmpeg provisioned from system runner environment."
            } else {
              Write-Host "Downloading standalone FFmpeg..."
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
              Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
              $found = (Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1).FullName
              Copy-Item -Force $found "bin\ffmpeg.exe"
              Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
            }
          }

      - name: Build Standalone with Nuitka
        run: |
          python -m nuitka --standalone --plugin-enable=pyside6 --include-qt-plugins=sensible,multimedia,imageformats,iconengines --assume-yes-for-downloads --windows-icon-from-ico="resources/branding/ICO/DrawMotion.ico" --windows-console-mode=disable --include-package=components --include-package=core --include-package=advanced_features --include-package=graphics --include-package=services --include-package=asset_library --include-package=utils --include-package=models --include-data-dir="resources=resources" --include-data-dir="bin=bin" --include-data-dir="assets=assets" --include-data-dir="core/security_engine/bin=core/security_engine/bin" --include-data-dir="components/project_hub/qml=components/project_hub/qml" --include-data-dir="components/write_to_image/effects/qml=components/write_to_image/effects/qml" --nofollow-import-to=scipy --output-dir="dist" --output-filename="DrawMotion" main.py

      - name: Stage MSIX Layout
        run: |
          New-Item -ItemType Directory -Path "msix_staging" -Force
          $distDir = if (Test-Path "dist\main.dist") { "dist\main.dist" } elseif (Test-Path "dist\DrawMotion.dist") { "dist\DrawMotion.dist" } else { "dist\DrawMotion" }
          Copy-Item -Recurse "$distDir\*" "msix_staging\"

          # Bundle PySide6 QML runtime modules for MSIX
          $pysideDir = (python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          $pysideQml = Join-Path $pysideDir "qml"
          if (Test-Path $pysideQml) {
            New-Item -ItemType Directory -Path "msix_staging\PySide6\qml" -Force | Out-Null
            Copy-Item -Recurse -Force "$pysideQml\*" "msix_staging\PySide6\qml\"
          }
          Copy-Item -Force "$pysideDir\Qt6QuickControls2*.dll" "msix_staging\"
          Copy-Item -Force "$pysideDir\Qt6QuickLayouts*.dll" "msix_staging\"
          Copy-Item -Force "$pysideDir\Qt6QuickShapes*.dll" "msix_staging\"
          Copy-Item -Force "$pysideDir\Qt6QmlCore*.dll" "msix_staging\"

          Copy-Item "build_assets\msstore\AppxManifest.xml" "msix_staging\"
          if (-not (Test-Path "msix_staging\Assets")) {
            New-Item -ItemType Directory -Path "msix_staging\Assets" -Force
          }
          Copy-Item -Path "build_assets\msstore\Assets\*" -Destination "msix_staging\Assets\" -Recurse -Force

          # Sync version into manifest safely preserving <?xml version="1.0" encoding="utf-8"?>
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.7.13" }
          $parts = $tag.Split('.')
          while ($parts.Length -lt 4) { $parts += "0" }
          $quadVersion = $parts -join '.'

          $manifestPath = "$PWD\msix_staging\AppxManifest.xml"
          $content = [System.IO.File]::ReadAllText($manifestPath)
          $updated = [System.Text.RegularExpressions.Regex]::Replace($content, '(?<=<Identity[^>]*Version=")[^"]+', $quadVersion)
          [System.IO.File]::WriteAllText($manifestPath, $updated, [System.Text.UTF8Encoding]::new($false))

      - name: Pack MSIX with MakeAppx
        run: |
          New-Item -ItemType Directory -Path "build_out" -Force
          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1).FullName
          & $makeappx pack /d "msix_staging" /p "build_out\DrawMotion_Store_x64.msix" /nv /o

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawMotion_Store_MSIX
          path: build_out/DrawMotion_Store_x64.msix
          retention-days: 14

      - name: Generate MSIX SHA-256 Checksum
        run: |
          $hash = (Get-FileHash -Path "build_out\DrawMotion_Store_x64.msix" -Algorithm SHA256).Hash
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.7.11" }
          Set-Content -Path "build_out\checksum_msstore.txt" -Value "DrawMotion_Store_x64.msix  SHA256: $hash  ($version)"
          Write-Host "Store MSIX SHA-256: $hash"

      - name: Attach to Release (if Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_out/DrawMotion_Store_x64.msix
            build_out/checksum_msstore.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
