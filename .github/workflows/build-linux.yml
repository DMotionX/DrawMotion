name: Build Linux Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux Standalone Binary (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies for Qt6 & Multimedia
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libasound2 \
            libpulse0 \
            ffmpeg \
            patchelf \
            ccache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka
      - name: Clean Local Caches
        run: |
          rm -rf assets/uploads assets/library *.sqlite

      - name: Build Standalone Executable with Nuitka
        run: |
          python -m nuitka --standalone \
            --plugin-enable=pyside6 \
            --include-qt-plugins=sensible,multimedia,imageformats,iconengines \
            --assume-yes-for-downloads \
            --include-package=components \
            --include-package=core \
            --include-package=advanced_features \
            --include-package=graphics \
            --include-package=services \
            --include-package=asset_library \
            --include-package=utils \
            --include-package=models \
            --include-data-dir="resources=resources" \
            --include-data-dir="assets=assets" \
            --nofollow-import-to=scipy \
            --output-dir="dist" \
            --output-filename="DrawMotion" \
            main.py

          if [ -d "dist/main.dist" ]; then mv dist/main.dist dist/DrawMotion; elif [ -d "dist/DrawMotion.dist" ]; then mv dist/DrawMotion.dist dist/DrawMotion; fi
          chmod +x dist/DrawMotion/DrawMotion

      - name: Create Linux Tarball Archive
        run: |
          cd dist
          tar -czvf DrawMotion_Linux_x86_64.tar.gz DrawMotion
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawMotion_Linux_x86_64
          path: dist/DrawMotion_Linux_x86_64.tar.gz
          retention-days: 14

      - name: Attach to Release (if Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DrawMotion_Linux_x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
