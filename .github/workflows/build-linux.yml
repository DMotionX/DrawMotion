name: Build Linux Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux Standalone Binary (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies for Qt6 & Multimedia
        run: |
          sudo apt-get update

          ALSA_PKG="libasound2t64"
          if ! apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG="libasound2"
          fi

          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            $ALSA_PKG \
            libpulse0 \
            ffmpeg \
            patchelf \
            ccache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka
      - name: Clean Local Caches
        run: |
          rm -rf assets/uploads assets/library *.sqlite

      - name: Build Standalone Executable with Nuitka
        run: |
          python -m nuitka --standalone \
            --plugin-enable=pyside6 \
            --include-qt-plugins=sensible,multimedia,imageformats,iconengines \
            --assume-yes-for-downloads \
            --include-package=components \
            --include-package=core \
            --include-package=advanced_features \
            --include-package=graphics \
            --include-package=services \
            --include-package=asset_library \
            --include-package=utils \
            --include-package=models \
            --include-data-dir="resources=resources" \
            --include-data-dir="assets=assets" \
            --include-data-dir="components/project_hub/qml=components/project_hub/qml" \
            --include-data-dir="components/write_to_image/effects/qml=components/write_to_image/effects/qml" \
            --nofollow-import-to=scipy \
            --output-dir="dist" \
            --output-filename="DrawMotion" \
            main.py

          if [ -d "dist/main.dist" ]; then mv dist/main.dist dist/DrawMotion; elif [ -d "dist/DrawMotion.dist" ]; then mv dist/DrawMotion.dist dist/DrawMotion; fi
          chmod +x dist/DrawMotion/DrawMotion

      - name: Create Linux Tarball Archive
        run: |
          cd dist
          tar -czvf DrawMotion_Linux_x86_64.tar.gz DrawMotion
          cd ..

      - name: Build Direct Debian Package (.deb)
        run: |
          mkdir -p deb_staging/DEBIAN
          mkdir -p deb_staging/opt/DrawMotion
          mkdir -p deb_staging/usr/bin
          mkdir -p deb_staging/usr/share/applications
          mkdir -p deb_staging/usr/share/icons/hicolor/256x256/apps

          cp -r dist/DrawMotion/* deb_staging/opt/DrawMotion/
          chmod +x deb_staging/opt/DrawMotion/DrawMotion

          ln -s /opt/DrawMotion/DrawMotion deb_staging/usr/bin/drawmotion
          cp resources/branding/PNG/DrawMotion_256x256.png deb_staging/usr/share/icons/hicolor/256x256/apps/drawmotion.png

          cat << 'EOF' > deb_staging/usr/share/applications/drawmotion.desktop
          [Desktop Entry]
          Name=DrawMotion
          Comment=Professional Whiteboard Video & Vector Animation Studio
          Exec=/opt/DrawMotion/DrawMotion %F
          Icon=drawmotion
          Terminal=false
          Type=Application
          Categories=Graphics;AudioVideo;Video;
          MimeType=application/x-drawmotion;
          EOF

          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ]; then VERSION="1.7.10"; fi

          cat << EOF > deb_staging/DEBIAN/control
          Package: drawmotion
          Version: $VERSION
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: EASY SOFT TEAM <easysoft.dv2team@gmail.com>
          Description: Professional Open-Source Whiteboard Video & Vector Animation Studio
          EOF

          dpkg-deb --build --root-owner-group deb_staging dist/DrawMotion_${VERSION}_amd64.deb
          cp dist/DrawMotion_${VERSION}_amd64.deb dist/DrawMotion_amd64.deb

      - name: Build Direct Standalone AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r dist/DrawMotion/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/DrawMotion

          cp resources/branding/PNG/DrawMotion_256x256.png AppDir/drawmotion.png
          cp resources/branding/PNG/DrawMotion_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/drawmotion.png

          cat << 'EOF' > AppDir/drawmotion.desktop
          [Desktop Entry]
          Name=DrawMotion
          Comment=Professional Whiteboard Video & Vector Animation Studio
          Exec=DrawMotion %F
          Icon=drawmotion
          Terminal=false
          Type=Application
          Categories=Graphics;AudioVideo;
          EOF

          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/bin"
          export QT_QPA_PLATFORM="xcb;wayland"
          exec "${HERE}/usr/bin/DrawMotion" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir dist/DrawMotion-x86_64.AppImage
          chmod +x dist/DrawMotion-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DrawMotion_Linux_Packages
          path: |
            dist/DrawMotion-x86_64.AppImage
            dist/DrawMotion_amd64.deb
            dist/DrawMotion_Linux_x86_64.tar.gz
          retention-days: 14

      - name: Attach Packages to Release (if Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DrawMotion-x86_64.AppImage
            dist/DrawMotion_amd64.deb
            dist/DrawMotion_Linux_x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
